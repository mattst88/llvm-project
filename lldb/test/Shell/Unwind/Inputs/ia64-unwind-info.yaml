## The core file of ia64-unwind-info.s: a thread that stopped in the second
## instruction of leaf, which middle called, which _start called.
##
## The memory stack is the four doublewords at sp, the frame of middle; the
## third is where it saved rp.
##
## The register backing store is the three registers that _start has to
## itself, the four of middle and the two of leaf. The note's bsp is where it
## ends. The second doubleword of middle's four is the last of a group of 64,
## which is not a register but the NaT bits of the 63 before it.

--- !ELF
FileHeader:
  Class:        ELFCLASS64
  Data:         ELFDATA2LSB
  Type:         ET_CORE
  Machine:      EM_IA_64
ProgramHeaders:
  - Type:       PT_NOTE
    FirstSec:   .note
    LastSec:    .note
  - Type:       PT_LOAD
    Flags:      [ PF_R, PF_W ]
    VAddr:      0x20000000008001d8
    FirstSec:   .rbs
    LastSec:    .rbs
  - Type:       PT_LOAD
    Flags:      [ PF_R, PF_W ]
    VAddr:      0x200000000080f3e0
    FirstSec:   .stack
    LastSec:    .stack
Sections:
  - Name:       .note
    Type:       SHT_NOTE
    Notes:
      - Name:   CORE
        Desc:   
        Type:   NT_PRSTATUS
  - Name:       .rbs
    Type:       SHT_PROGBITS
    Flags:      [ SHF_ALLOC, SHF_WRITE ]
    Address:    0x20000000008001d8
    Content:    0000000000000000000000000000000000000000000000000500000000000000d0baaddbbaaddbba06000000000000008501000000000000a00100000000004005000000000000000600000000000000
  - Name:       .stack
    Type:       SHT_PROGBITS
    Flags:      [ SHF_ALLOC, SHF_WRITE ]
    Address:    0x200000000080f3e0
    Content:    11111111111111112222222222222222a0010000000000404444444444444444
...
