## The core file of ia64-frameless-recursion.s: a thread that stopped in the
## first instruction of leaf, which three instances of again that have no
## frame on the memory stack lead to. The register backing store has the
## argument of each, the frame marker of its caller and where to return to.

--- !ELF
FileHeader:
  Class:        ELFCLASS64
  Data:         ELFDATA2LSB
  Type:         ET_CORE
  Machine:      EM_IA_64
ProgramHeaders:
  - Type:       PT_NOTE
    FirstSec:   .note
    LastSec:    .note
  - Type:       PT_LOAD
    Flags:      [ PF_R, PF_W ]
    VAddr:      0x2000000000800100
    FirstSec:   .rbs
    LastSec:    .rbs
  - Type:       PT_LOAD
    Flags:      [ PF_R, PF_W ]
    VAddr:      0x200000000080f400
    FirstSec:   .stack
    LastSec:    .stack
Sections:
  - Name:       .note
    Type:       SHT_NOTE
    Notes:
      - Name:   CORE
        Desc:   
        Type:   NT_PRSTATUS
  - Name:       .rbs
    Type:       SHT_PROGBITS
    Flags:      [ SHF_ALLOC, SHF_WRITE ]
    Address:    0x2000000000800100
    Content:    0000000000000000000000000000000002000000000000000301000000000000a001000000000040010000000000000084010000000000000002000000000040000000000000000084010000000000000002000000000040ffffffffffffffff
  - Name:       .stack
    Type:       SHT_PROGBITS
    Flags:      [ SHF_ALLOC, SHF_WRITE ]
    Address:    0x200000000080f400
    Content:    11111111111111112222222222222222
...
