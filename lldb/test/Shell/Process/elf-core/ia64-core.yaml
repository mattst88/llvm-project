## Check that lldb reads IA-64 registers out of a core file.  The register
## block of the NT_PRSTATUS note is the kernel's elf_gregset_t: r0-r31, the
## NaT bits, pr, b0-b7, ip, cfm, psr and then the application registers.
##
## ip in the note is the address of the bundle, and the slot is in psr.ri;
## lldb's ip is the two added.
##
## The stacked registers are not in the note.  They are in the register
## backing store, which ends at the note's bsp: with three registers in the
## frame and that one doubleword into a group of 64, r32 and r33 are the last
## two registers of the group before, and the doubleword between them and r34
## holds NaT bits.
##
## The bsp of the note is the kernel's, the end of the backing store.  lldb's
## is the one the program had, which is where r32 is.
##
## EI_OSABI is left at ELFOSABI_NONE, as the kernel and qemu-user leave it;
## every note here is owned by "CORE", so nothing else names the OS.

# RUN: yaml2obj %s -o %t
# RUN: %lldb -c %t -o "register read --all" | FileCheck %s

# CHECK: General Purpose Registers:
# CHECK: r1 = 0x4000000000128e98
# CHECK: r8 = 0x000000000000002a
# CHECK: r12 = 0x200000000080f3b0
# CHECK: r32 = 0x1111111111111111
# CHECK-NEXT: r33 = 0x2222222222222222
# CHECK-NEXT: r34 = 0x3333333333333333
# CHECK-NOT: r35 =
# CHECK: b0 = 0x4000000000027a90
# CHECK: pr = 0x0000000000002981
# CHECK: ip = 0x4000000000027a41
# CHECK: cfm = 0x0000000000000183
# CHECK: bsp = 0x20000000008021e8
# CHECK: pfs = 0x0000000000000309

## The floating-point registers come from the NT_FPREGSET note, 16 bytes to
## a register.  Each is there as its value and as those bytes.  f0 and f1 are
## zero and one whatever the note has; f6 is what setf.sig leaves of 42, f7
## is NaTVal and f9 an infinity.
# CHECK: Floating Point Registers:
# CHECK: f0 = 0
# CHECK-NEXT: f1 = 1
# CHECK-NEXT: f2 = 1.5
# CHECK: f6 = 42
# CHECK-NEXT: f7 = NaN
# CHECK-NEXT: f8 = -5
# CHECK-NEXT: f9 = +Inf
# CHECK: f127 = 0.5
# CHECK: Floating Point Registers As Saved:
# CHECK: f0_raw = 0x00000000000000000000000000000000
# CHECK-NEXT: f1_raw = 0x000000000000ffff8000000000000000
# CHECK-NEXT: f2_raw = 0x000000000000ffffc000000000000000
# CHECK: f6_raw = 0x000000000001003e000000000000002a
# CHECK-NEXT: f7_raw = 0x000000000001fffe0000000000000000
# CHECK-NEXT: f8_raw = 0x0000000000030001a000000000000000

--- !ELF
FileHeader:
  Class:        ELFCLASS64
  Data:         ELFDATA2LSB
  Type:         ET_CORE
  Machine:      EM_IA_64
ProgramHeaders:
  - Type:       PT_NOTE
    FirstSec:   .note
    LastSec:    .note
  - Type:       PT_LOAD
    Flags:      [ PF_R, PF_W ]
    VAddr:      0x20000000008021e8
    FirstSec:   .rbs
    LastSec:    .rbs
Sections:
  - Name:       .note
    Type:       SHT_NOTE
    Notes:
      - Name:   CORE
        Desc:   
        Type:   NT_PRSTATUS
      - Name:   CORE
        Desc:   
        Type:   NT_FPREGSET
  - Name:       .rbs
    Type:       SHT_PROGBITS
    Flags:      [ SHF_ALLOC, SHF_WRITE ]
    Address:    0x20000000008021e8
    Content:    11111111111111112222222222222222d0baaddbbaaddbba3333333333333333
...
