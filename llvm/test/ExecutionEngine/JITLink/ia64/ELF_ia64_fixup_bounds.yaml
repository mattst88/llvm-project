# A relocation of a data word that does not lie within its section is
# refused, and nothing is written past the end of the block. main refers to
# the data so that it is kept.

# CHECK: section .data: [[KIND]] at {{.*}} does not fit in its block

--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_REL
  Machine: EM_IA_64
  Flags:   [ EF_IA_64_ABI64 ]
Sections:
  - Name:         .text
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 0x10
    Content:      '11700002002480000000428008008400'
  - Name:         .rela.text
    Type:         SHT_RELA
    Flags:        [ SHF_INFO_LINK ]
    Link:         .symtab
    AddressAlign: 0x8
    Info:         .text
    Relocations:
      - Symbol: x
        Type:   R_IA64_LTOFF22
  - Name:         .data
    Type:         SHT_PROGBITS
    Flags:        [ SHF_WRITE, SHF_ALLOC ]
    AddressAlign: 0x8
    Content:      '000000000000000000000000'
  - Name:         .rela.data
    Type:         SHT_RELA
    Flags:        [ SHF_INFO_LINK ]
    Link:         .symtab
    AddressAlign: 0x8
    Info:         .data
    Relocations:
      - Symbol: x
        Offset: [[OFFSET]]
        Type:   [[TYPE]]
Symbols:
  - Name:    x
    Section: .data
  - Name:    main
    Type:    STT_FUNC
    Section: .text
    Binding: STB_GLOBAL
    Size:    0x10
